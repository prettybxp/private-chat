<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>私人聊天室</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="modal" class="modal hidden">
        <div class="modal-card">
          <h1>进入聊天室</h1>
          <p class="modal-hint">输入昵称后即可开始聊天</p>
          <input
            id="nickname-input"
            type="text"
            maxlength="20"
            placeholder="昵称（1–20 字）"
            autocomplete="off"
          />
          <p id="modal-error" class="error hidden"></p>
          <button id="nickname-submit" type="button">进入</button>
        </div>
      </div>

      <div id="chat" class="chat hidden">
        <div id="banner" class="banner hidden">连接断开，正在重连…</div>
        <div class="layout">
          <section class="main-panel">
            <header class="chat-header">
              <h1>私人聊天室</h1>
              <p class="header-hint">
                <a href="/private-chat-extension.zip" download>下载 Chrome 插件</a>
                ，关闭本页仍可收到新消息
              </p>
            </header>
            <div id="messages" class="messages"></div>
            <div class="composer-box">
              <div id="image-preview" class="image-preview hidden"></div>
              <p id="composer-error" class="error hidden"></p>
              <form id="composer" class="composer">
                <button id="image-btn" class="image-btn" type="button" title="发送图片">图片</button>
                <button id="file-btn" class="image-btn" type="button" title="发送文件">文件</button>
                <input
                  id="image-input"
                  type="file"
                  accept="image/jpeg,image/png,image/gif,image/webp"
                  hidden
                />
                <input id="file-input" type="file" hidden />
                <textarea
                  id="message-input"
                  rows="2"
                  maxlength="2000"
                  placeholder="输入消息，Enter 发送；可发图片、文件，或粘贴截图"
                ></textarea>
                <button id="send-btn" type="submit">发送</button>
              </form>
            </div>
          </section>
          <aside class="sidebar">
            <h2 id="members-title">在线 (0)</h2>
            <ul id="members-list" class="members-list"></ul>
          </aside>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
